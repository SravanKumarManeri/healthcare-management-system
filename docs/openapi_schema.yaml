  /api/auth/users/:
    get:
      operationId: auth_users_list
      description: Admin-only management of system users and staff accounts.
      parameters:
      - in: query
        name: is_active
        schema:
          type: boolean
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: role
        schema:
          type: string
          enum:
          - ADMIN
          - DOCTOR
          - PATIENT
          - PHARMACIST
          - RECEPTIONIST
        description: |-
          System role determining permissions and access scope.

          * `ADMIN` - Administrator
          * `DOCTOR` - Doctor
          * `RECEPTIONIST` - Receptionist
          * `PHARMACIST` - Pharmacist
          * `PATIENT` - Patient
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - auth
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUserList'
          description: ''
    post:
      operationId: auth_users_create
      description: Admin-only management of system users and staff accounts.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffUserCreateRequest'
          application/x-www-form-urlencoded:
