          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Department'
          description: ''
    delete:
      operationId: departments_destroy
      description: Retrieve, update, or delete a department (Admin only for modification).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - departments
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '204':
          description: No response body
  /api/doctors/:
    get:
      operationId: doctors_list
      description: Search and filter active doctors. Admins can create doctor profiles.
      parameters:
      - in: query
        name: department
