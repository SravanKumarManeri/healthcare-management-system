        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - DRAFT
          - FINAL
        description: |-
          * `DRAFT` - Draft
          * `FINAL` - Final
      tags:
      - consultations
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedConsultationList'
          description: ''
    post:
      operationId: consultations_create
      description: List clinical consultations (role-scoped) or create a new consultation
        note (Doctor only).
      tags:
