openapi: 3.0.3
info:
  title: Healthcare Management System (HMS) API
  version: 1.0.0
  description: Production-grade RESTful API for multi-role Healthcare Management System
    including Patient Registration, Doctor Schedules, Appointments, Consultations,
    Prescriptions, and Pharmacy Stock/Dispensing.
paths:
  /api/appointments/:
    get:
      operationId: appointments_list
      description: List appointments (role-scoped) or book a new appointment with
        concurrency-safe slot locking.
      parameters:
      - in: query
        name: appointment_date
        schema:
          type: string
          format: date
      - in: query
        name: department
        schema:
          type: integer
      - in: query
        name: doctor
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: patient
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - BOOKED
          - CANCELLED
          - CHECKED_IN
          - COMPLETED
          - CONFIRMED
          - NO_SHOW
        description: |-
          * `BOOKED` - Booked
          * `CONFIRMED` - Confirmed
          * `CHECKED_IN` - Checked In
          * `COMPLETED` - Completed
          * `CANCELLED` - Cancelled
          * `NO_SHOW` - No Show
      tags:
      - appointments
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAppointmentList'
          description: ''
    post:
      operationId: appointments_create
      description: List appointments (role-scoped) or book a new appointment with
        concurrency-safe slot locking.
      tags:
      - appointments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppointmentBookingRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AppointmentBookingRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AppointmentBookingRequest'
        required: true
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentBooking'
          description: ''
  /api/appointments/{id}/:
    get:
      operationId: appointments_retrieve
      description: View details of a specific appointment with role-based scoping.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - appointments
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
          description: ''
  /api/appointments/{id}/cancel/:
    post:
      operationId: appointments_cancel_create
      description: Cancel an appointment with audit trail.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - appointments
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: {}
          multipart/form-data:
            schema:
              type: object
              additionalProperties: {}
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/appointments/{id}/check-in/:
    post:
      operationId: appointments_check_in_create
      description: Receptionist checks in patient upon arrival at the clinic.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - appointments
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/appointments/{id}/complete/:
    post:
      operationId: appointments_complete_create
      description: Doctor or Admin marks appointment as completed.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - appointments
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/appointments/{id}/reschedule/:
    patch:
      operationId: appointments_reschedule_partial_update
      description: |-
        Reschedule an existing appointment to a new date and time slot.
        Executed in a transaction so original booking is preserved if the new slot is unavailable.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - appointments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAppointmentRescheduleRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAppointmentRescheduleRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAppointmentRescheduleRequest'
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
          description: ''
