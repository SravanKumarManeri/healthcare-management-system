components:
  schemas:
    Appointment:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        patient:
          type: integer
        patient_name:
          type: string
          readOnly: true
        patient_number:
          type: string
          readOnly: true
        patient_phone:
          type: string
          readOnly: true
        doctor:
          type: integer
        doctor_name:
          type: string
          readOnly: true
        doctor_specialization:
          type: string
          readOnly: true
        department:
          type: integer
          readOnly: true
        department_name:
          type: string
          readOnly: true
        appointment_date:
          type: string
          format: date
        start_time:
          type: string
          format: time
        end_time:
          type: string
          format: time
        reason_for_visit:
          type: string
          maxLength: 255
        status:
          allOf:
          - $ref: '#/components/schemas/AppointmentStatusEnum'
          readOnly: true
        status_display:
          type: string
          readOnly: true
        cancellation_reason:
          type: string
        has_consultation:
          type: string
          readOnly: true
        has_prescription:
          type: string
          readOnly: true
        status_history:
          type: array
          items:
            $ref: '#/components/schemas/AppointmentStatusHistory'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
